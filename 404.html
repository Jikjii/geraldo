<!doctype html>
<!--
  index.html and 404.html must stay identical (404.html is the deep-link fallback
  for GitHub Pages). After editing this file, run:  cp index.html 404.html

  Content lives in content.js. The values below are only what link previews and
  visitors without JavaScript see; the script keeps titles and descriptions in
  sync with content.js as people browse.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- EDIT: the folder this site is served from, in the href of the next line.
     It must start and end with "/":
       "/"             the site sits at the root of its domain (https://you.com/)
       "/portfolio/"   a GitHub Pages project site (https://you.github.io/portfolio/)
     Every relative address below (assets/site.css, content.js, ...) resolves
     from that folder, even on a deep link like /geraldo/projects/crewroom,
     and the page addresses (/work/..., /projects/...) live inside it. -->
<base href="/geraldo/">
<script>
  /* Tidies the folder above and shares it with assets/site.js as
     window.SITE_BASE. Opened from disk, the base is removed so addresses
     resolve next to this file. If the page is served from outside the folder
     (say, at the root of a custom domain while the setting still names a
     folder), the root is used instead, so the site still loads. */
  (function () {
    var el = document.querySelector("base");
    var base = String((el && el.getAttribute("href")) || "/").trim();
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(base)) base = base.replace(/^[a-z][a-z0-9+.-]*:\/\/[^\/]*/i, "");
    base = ("/" + base + "/").replace(/\/{2,}/g, "/");
    if (location.protocol === "file:") {
      if (el) el.parentNode.removeChild(el);
    } else {
      if ((location.pathname + "/").indexOf(base) !== 0) base = "/";
      if (!el) {
        el = document.createElement("base");
        document.head.appendChild(el);
      }
      el.setAttribute("href", base);
    }
    window.SITE_BASE = base;
  })();
</script>
